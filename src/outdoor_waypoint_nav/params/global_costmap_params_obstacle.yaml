global_frame: map
robot_base_frame: base_link
update_frequency: 5.0
# Dijkstra consumes the internal 5 Hz costmap. RViz only needs a 2 Hz copy.
publish_frequency: 2.0
# A 300 m rolling window keeps longer waypoint segments inside the lethal
# outline and leaves enough room for obstacle-avoidance detours.
width: 300.0
height: 300.0
resolution: 0.20
static_map: false
rolling_window: true
# Small RTK/INS/EKF timing jitter can make map->odom look slightly stale for a
# few milliseconds; give the planner a wider tolerance than the default.
transform_tolerance: 2.0
track_unknown_space: false
