TrajectoryPlannerROS:
  # The Warthog has a noticeable low-speed deadband.  With dwa=true and the
  # old 0.40 m/s^2 acceleration window, odometry stayed near zero and the
  # planner could only sample 0.05-0.10 m/s forever.  Rollout mode evaluates
  # the complete useful velocity range; cmd_vel_smoother_obstacle still
  # enforces gradual acceleration on the real vehicle.
  # Match the acceleration actually enforced by cmd_vel_smoother_obstacle.
  # Otherwise the rollout assumes that the heavy platform can change speed
  # faster than the command path permits.
  acc_lim_x: 0.50
  acc_lim_theta: 0.70

  max_vel_x: 0.90
  min_vel_x: 0.216
  max_vel_theta: 0.48
  min_vel_theta: -0.48
  min_in_place_vel_theta: 0.30

  holonomic_robot: false
  escape_vel: 0.0

  # Any normalized yaw error is <= pi, so orientation never blocks success or
  # causes an in-place final rotation.
  yaw_goal_tolerance: 3.1415927
  # Intermediate points are canceled by the RTK checker at 0.50 m. Keep the
  # planner position tolerance at 0.10 m for the final waypoint.
  xy_goal_tolerance: 0.10
  latch_xy_goal_tolerance: true

  # A 1.4 s rollout still covers 1.26 m at max speed (more than the measured
  # stopping distance), but is less likely to reject every candidate because
  # of one short-lived far-ahead cost cell. Extra x samples let the planner
  # select an intermediate speed instead of alternating between 0.90 and zero.
  sim_time: 1.4
  sim_granularity: 0.05
  angular_sim_granularity: 0.04
  vx_samples: 14
  vtheta_samples: 24
  controller_frequency: 10.0

  meter_scoring: true
  # These are the scoring names actually consumed by TrajectoryPlannerROS.
  # Favor the straight global path, while collision safety remains a hard
  # footprint check. occdist_scale only controls extra soft clearance.
  pdist_scale: 2.00
  gdist_scale: 0.40
  occdist_scale: 0.05
  heading_scoring: false
  heading_scoring_timestep: 0.80
  heading_lookahead: 1.00
  dwa: false
  simple_attractor: false
  prune_plan: true
  stop_time_buffer: 0.35
  publish_cost_grid_pc: false

  oscillation_reset_dist: 0.05
  escape_reset_dist: 0.10
  escape_reset_theta: 0.10
