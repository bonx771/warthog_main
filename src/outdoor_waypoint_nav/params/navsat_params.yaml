navsat_transform:
  frequency: 50
  # Let both EKFs accept and settle on the absolute IMU yaw before the static
  # UTM->map transform is frozen. Freezing it during EKF yaw initialization
  # was the cause of the observed 114-degree map jump.
  delay: 15.0
  magnetic_declination_radians: -0.0304567
  yaw_offset: -1.9544
  zero_altitude: true
  broadcast_utm_transform: true
  publish_filtered_gps: true
  use_odometry_yaw: false
  wait_for_datum: false
