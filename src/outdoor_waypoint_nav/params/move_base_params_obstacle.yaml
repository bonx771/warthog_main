shutdown_costmaps: false
controller_frequency: 10.0
controller_patience: 20.0
# Do not turn one transient TrajectoryPlannerROS miss into a multi-second
# stop/global-replan cycle. During this grace interval move_base still publishes
# zero on every invalid cycle and retries at 10 Hz; a person crossing the path
# normally clears before the stack falls back to a global replan.
controller_replan_delay: 2.0
# Dijkstra runs over the 300 m obstacle costmap. One global replan per second
# avoids needless path replacement/CPU spikes; the 10 Hz local costmap still
# reacts immediately and stops the vehicle when a new obstacle blocks motion.
planner_frequency: 1.0
# Fail fast when a goal/subgoal is outside the usable costmap or has no path.
# gps_waypoint owns the higher-level retry and can select a closer virtual
# subgoal/proxy, so waiting 30 s inside move_base only repeats the same failed
# plan and makes every retry appear stuck.
planner_patience: 3.0
max_planning_retries: 2
oscillation_timeout: 0.0
oscillation_distance: 0.05
recovery_behavior_enabled: false
clearing_rotation_allowed: false

# gps_waypoint uses make_plan only after an action has aborted, to find a safe
# proxy around an occupied intermediate waypoint. Keep this probe read-only:
# LiDAR clearing already owns removal of dynamic-obstacle observations.
make_plan_clear_costmap: false
make_plan_add_unreachable_goal: false
