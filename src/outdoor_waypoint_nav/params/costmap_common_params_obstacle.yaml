# Parameters used only by move_base_nav_obstacle.launch.
obstacle_range: 12.0
raytrace_range: 15.0

# Measured UGV footprint: 1.52 x 1.38 m. Padding adds a 5 cm safety margin.
footprint: [[-0.76, -0.69], [-0.76, 0.69], [0.76, 0.69], [0.76, -0.69]]
footprint_padding: 0.05

plugins:
  - {name: obstacles_voxel_layer, type: "costmap_2d::VoxelLayer"}
  - {name: inflater_layer, type: "costmap_2d::InflationLayer"}

obstacles_voxel_layer:
  enabled: true
  footprint_clearing_enabled: true
  publish_voxel_map: false

  # Keep VoxelLayer storage while its observation source remains a 2-D scan.
  origin_z: -0.30
  z_resolution: 0.10
  z_voxels: 16
  unknown_threshold: 15
  mark_threshold: 0
  max_obstacle_height: 1.20

  # The Helios launch exports one 2-D scan used for both marking and clearing.
  observation_sources: helios_scan
  helios_scan:
    sensor_frame: rslidar
    data_type: LaserScan
    topic: /front/scan
    marking: true
    clearing: true
    min_obstacle_height: -0.24
    max_obstacle_height: 1.10
    obstacle_range: 12.0
    raytrace_range: 15.0
    observation_persistence: 0.0
    inf_is_valid: true

inflater_layer:
  # The exact 1.52 x 1.38 m footprint still performs hard collision checks.
  # This smaller, faster-decaying soft field keeps paths close to the direct
  # waypoint line instead of making a wide arc around every return.
  inflation_radius: 1.10
  cost_scaling_factor: 8.0

lethal_cost_threshold: 100
robot_base_frame: base_link
transform_tolerance: 0.5
